name: sync achievements

on:
  # run automatically once a day
  schedule:
    - cron: "0 2 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # PAT (same as snake.yml) so the push triggers a GitHub Pages rebuild;
          # falls back to the built-in token if the secret is not set.
          token: ${{ secrets.TOKEN || github.token }}

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: sync achievement badges from GitHub profile
        run: python3 scripts/sync-achievements.py

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/achievements index.html main.js
          if git diff --cached --quiet; then
            echo "Achievements already in sync."
          else
            git commit -m "chore: sync GitHub achievement badges"
            git push
          fi